name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Laytime engine
        run: python3 tests/test_laytime.py
      - name: API integration (DB sementara, ADR-0016)
        run: python3 tests/test_api.py
      - name: libsql backend
        run: python3 tests/test_libsql_backend.py
